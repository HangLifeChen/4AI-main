# ============================================================================
# 4ai.network 宝塔站点配置 —— 在默认配置基础上加入 4bsc 正式环境反向代理
#
# 路由规则:
#   /api/common/stream  → Nebulai SSE 推流  (127.0.0.1:17777, 需关缓冲)
#   /api/verify/*       → x402 付费资源服务 (127.0.0.1:8080, docker host 网络)
#   /api/aws/*          → Next.js 本地路由  (127.0.0.1:3000, S3 预签名,头像/文件)
#   /api/forward        → Next.js 本地路由  (127.0.0.1:3000)
#   /api/*              → Nebulai 后端       (127.0.0.1:17777, front/admin/common)
#   其余 /              → Next.js 前端       (127.0.0.1:3000, pm2 4bsc_meme_prod)
#   facilitator.4ai.network → x402 facilitator (文件末尾独立 server 块)
#
# FourAIScanner 只有 cron + 出站 WSS,无入口 HTTP,不需要 nginx 转发。
# 后端跨机部署时,改对应 proxy_pass 的目标即可。
#
# ⚠️ 本文件与 52.44.132.84 站点配置同时部署时,map 变量名已错开
#    ($connection_upgrade_4ai vs $connection_upgrade_4bsc),避免 duplicate 冲突。
#
# ⚠️ 切换到本域名后需同步改:
#    1. 前端 .env.production 的 NEXT_PUBLIC_REQUEST_DOMAIN 并重新 npm run prod
#    2. x402test config_prod.yaml 的 base_url / facilitator_url
#    3. Nebulai config.prod.yaml 的 server.domain 及 OAuth redirect_url
#
# ⚠️ /api/aws/* 与 /api/forward 是 Next.js 前端自己的 API 路由
#    (S3 预签名签名/秒传检查),后端没有这些接口,必须指回 3000,
#    否则头像上传/展示全部 Not found。nginx 前缀匹配取最长者,
#    ^~ /api/aws/ 比 ^~ /api/ 更长,天然优先,无需调整顺序。
# ============================================================================

# WebSocket 升级头映射(Next.js 需要;变量名带后缀,避免与其他站点重复定义冲突)
map $http_upgrade $connection_upgrade_4ai {
    default upgrade;
    ''      close;
}

server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name 4ai.network www.4ai.network;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/4ai.network;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/4ai.network.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/4ai.network/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/4ai.network/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/4ai.network/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443";h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;

    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/4ai.network.conf;
    #REWRITE-END

    # ======================= 正式环境反向代理 =======================

    # 文件上传(浏览器直传 S3,不走 nginx;此处宽松以防后端有上传接口)
    client_max_body_size 100m;

    # ---------- SSE 推流(Nebulai /api/common/stream,前端 useSSE 直连) ----------
    # 精确匹配,优先级最高;必须关闭缓冲、拉长读超时
    location = /api/common/stream {
        proxy_pass http://127.0.0.1:17777;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        add_header X-Accel-Buffering no;
    }

    # ---------- x402 付费资源(POST /api/verify/:id → x402test:8080) ----------
    # Nebulai 只有 /api/front /api/admin /api/common,/api/verify 不会被占用;
    # ^~ 保证前缀匹配优先于下方正则规则
    # 402 状态与 X-PAYMENT / X-PAYMENT-RESPONSE 头必须原样透传
    # (nginx 默认透传,不要加 error_page / proxy_intercept_errors)
    location ^~ /api/verify/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Next.js 本地路由:S3 预签名(头像/文件上传下载核心) ----------
    # /api/aws/signature、/api/aws/head 由前端 Next.js 实现(src/app/api/aws/),
    # 用于生成 S3 预签名 URL 和秒传检查;后端(17777)没有这两个接口。
    # 前缀 ^~ /api/aws/ 比 ^~ /api/ 更长,nginx 取最长匹配,优先级天然更高。
    location ^~ /api/aws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- Next.js 本地路由:转发接口 ----------
    # /api/forward 同样是前端自己的路由(src/app/api/forward),指回 3000
    location ^~ /api/forward {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- 后端 API(Nebulai:front / admin / common) ----------
    # 注意:不要接 /api/aws/* 和 /api/forward,那两个是 Next.js 的本地路由
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:17777;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- 前端(Next.js:3000) ----------
    # ⚠️ 必须显式关闭代理缓存:宝塔全局 http 层有 proxy_cache cache_one,
    #    而 Next.js 静态页响应头带 s-maxage=31536000,会被缓存一年,
    #    导致 rebuild 后 nginx 仍吐旧 HTML、引用已删除的 chunk 而 404。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_4ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
    }

    # ===================== 反向代理配置结束 =====================

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # ⚠️ 下面两条静态资源规则已注释:
    # 正则 location 优先级高于上面的前缀 location "/",会把 Next.js 的
    # /_next/static/*.js、图片等请求劫持到本地 /www/wwwroot 目录返回 404。
    # 站点现在是纯反向代理,静态资源由 Next.js 自己输出并带缓存头。
    #location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    #{
    #    expires      30d;
    #    error_log /dev/null;
    #    access_log /dev/null;
    #}

    #location ~ .*\.(js|css)?$
    #{
    #    expires      12h;
    #    error_log /dev/null;
    #    access_log /dev/null;
    #}
    access_log  /www/wwwlogs/4ai.network.log;
    error_log  /www/wwwlogs/4ai.network.error.log;
}

# ============================================================================
# facilitator.4ai.network —— x402 协议 verify / settle 端点
# ⚠️ 当前 x402test 的 config_prod.yaml 里写的是 facilitator.4bsc.ai,
#    切换到本域名时需把 base_url / facilitator_url 同步改成 4ai.network。
# ⚠️ 8081 为占位端口,按 facilitator 实际监听端口修改;
#    若 facilitator 是 DNS 直接解析到官方/云端服务,删除本块即可。
# ============================================================================
server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name facilitator.4ai.network;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log  /www/wwwlogs/facilitator.4ai.network.log;
    error_log   /www/wwwlogs/facilitator.4ai.network.error.log;
}
